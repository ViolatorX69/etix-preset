<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etix Automated Launcher Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .control-panel {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            max-width: 400px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
        }
        .btn:hover { background-color: #2563eb; }
        p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

<div class="control-panel">
    <h2>Etix Direct Automation</h2>
    <p>Click the button below to initialize the target portal session and load your external script module automatically.</p>
    <button class="btn" onclick="launchAndInject()">Launch Ticket Portal</button>
</div>

<script>
function launchAndInject() {
    // Execution 1: Define the target configurations
    const targetUrl = "https://www.etix.com/ticket/p/73231663/forbidden-chaos-by-designus-tour-2026-greensboro-hangar-1819";
    
    // Replace these placeholders with your actual GitHub deployment details
    const githubUser = "violatorx69";
    const githubRepo = "etix-preset";
    const externalScriptUrl = `https://githubusercontent.com{violatorx69}/${etix-preset}/main/etix-muiinjector.js`;

    console.log("🚀 Launching window context...");
    
    // Execution 2: Open a clean browser window reference pointing to the Etix portal
    const ticketWindow = window.open(targetUrl, '_blank');

    // Execution 3: Inject and run the external .js file from GitHub upon window initiation
    if (ticketWindow) {
        // We use a periodic check loop to ensure the window container exists in the browser lifecycle
        const checkWindowLoad = setInterval(() => {
            try {
                // Verify the child window document structure is accessible
                if (ticketWindow.document && ticketWindow.document.body) {
                    clearInterval(checkWindowLoad);
                    
                    console.log("⚡ Creating script element placeholder...");
                    // Programmatically construct a clean HTML script element node
                    const scriptElement = ticketWindow.document.createElement('script');
                    scriptElement.type = 'text/javascript';
                    scriptElement.src = externalScriptUrl;

                    // Append the external GitHub script asset directly into the target page session DOM
                    ticketWindow.document.head.appendChild(scriptElement);
                    console.log("✅ External GitHub script injected successfully into live session.");
                }
            } catch (securityError) {
                // If the browser cross-origin policy blocks immediate tab-reading, the interval reports the state
                console.log("⏳ Waiting for active browser context authorization...");
            }
        }, 100);
    } else {
        alert("Pop-up blocked! Please allow pop-ups for this domain to execute automation.");
    }
}
</script>

</body>
</html>
